services:
  postgres:
    build:
      context: ./deploy/postgres
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: modernization
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d modernization"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Minimal Langfuse-compatible placeholder stack:
  # Full Langfuse v3 requires additional services; enabling LANGFUSE_ENABLED=true
  # against a self-hosted Langfuse (see docs/OBSERVABILITY.md) is supported.
  # For local demos without the full Langfuse stack, keep LANGFUSE_ENABLED=false.

  pipeline:
    build: .
    ports:
      - "8123:8123"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pipeline:pipeline@postgres:5432/modernization
      DATABASE_URL_SYNC: postgresql://pipeline:pipeline@postgres:5432/modernization
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3000}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
