services:
  postgres:
    build:
      context: ./deploy/postgres
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: modernization
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d modernization"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional Langfuse self-hosted: docker compose -f docker-compose.yml -f docker-compose.langfuse.yml up -d
  # Keep LANGFUSE_ENABLED=false for the minimal stack (postgres + pipeline only).

  pipeline:
    build: .
    ports:
      - "8123:8123"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pipeline:pipeline@postgres:5432/modernization
      DATABASE_URL_SYNC: postgresql://pipeline:pipeline@postgres:5432/modernization
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3000}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
