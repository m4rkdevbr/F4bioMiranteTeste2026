# Optional Langfuse self-hosted stack (bonus observability) — Langfuse v2 (Postgres only).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.langfuse.yml up --build -d
#
# UI: http://localhost:3000
# Login: demo@modernization.local / demopass123
# Keys are auto-initialized (see LANGFUSE_INIT_* below).

services:
  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-web:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: modernization-langfuse-secret
      SALT: modernization-langfuse-salt
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: org-modernization
      LANGFUSE_INIT_ORG_NAME: Modernization Pipeline
      LANGFUSE_INIT_PROJECT_ID: proj-modernization
      LANGFUSE_INIT_PROJECT_NAME: Hybrid Pipeline
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-demo-modernization
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-demo-modernization
      LANGFUSE_INIT_USER_EMAIL: demo@modernization.local
      LANGFUSE_INIT_USER_NAME: Demo
      LANGFUSE_INIT_USER_PASSWORD: demopass123

  pipeline:
    environment:
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-demo-modernization}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-demo-modernization}
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-web:
        condition: service_started

volumes:
  langfuse_pgdata:
