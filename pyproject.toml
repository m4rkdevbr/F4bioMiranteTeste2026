[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modernization-pipeline"
version = "1.0.0"
description = "Hybrid LangGraph pipeline for modernizing PL/pgSQL stored procedures into Python 3.14"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "m4rkdevbr" }]
dependencies = [
  "langgraph>=0.2.60,<0.4",
  "langchain-core>=0.3.0,<0.4",
  "langchain-openai>=0.2.0,<0.4",
  "langfuse>=2.50.0,<3",
  "sqlglot>=25.0.0,<27",
  "asyncpg>=0.30.0,<1",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "httpx>=0.27.0,<1",
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.32.0,<1",
  "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<1",
  "pytest-cov>=6.0.0,<7",
  "ruff>=0.8.0,<1",
  "mypy>=1.13.0,<2",
  "types-requests>=2.32.0",
]

[project.scripts]
modernize-annexes = "scripts.run_annexes:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modernization_pipeline"]

[tool.hatch.build.targets.wheel.sources]
"src/modernization_pipeline" = "modernization_pipeline"

[tool.hatch.build.targets.sdist]
include = [
  "src/modernization_pipeline",
  "prompts",
  "sql",
  "scripts",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: tests that call OpenRouter (require OPENROUTER_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
packages = ["modernization_pipeline"]
mypy_path = "src"
ignore_missing_imports = true
